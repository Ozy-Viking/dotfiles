theme = "custom"
mode = "auto"
vcs = "git"          # git, jj, sl
watch = false
exclude_untracked = false
line_numbers = true
wrap_lines = true
menu_bar = true
agent_notes = true
transparent_background = false
hunk_headers = true
copy_decorations = false
cursor_line = "number"

[custom_theme]
base = "tokyo-night"
label = "Tokyo Night — changed words"
# Keep diff rows neutral; emphasize only changed text.
background = "#1a1b26"
contextBg = "#1a1b26"
addedBg = "#1a1b26"
removedBg = "#1a1b26"
movedAddedBg = "#1a1b26"
movedRemovedBg = "#1a1b26"
addedContentBg = "#294536"
removedContentBg = "#542d3a"
